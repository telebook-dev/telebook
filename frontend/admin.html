<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleBook</title>

    <!-- Motyw ustawiany PRZED pierwszym renderem, żeby nie było błysku jasnego tła -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('telebook-theme');
                var dark = saved
                    ? saved === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark-mode');
            } catch (e) {}
        })();
    </script>
    <script>document.documentElement.classList.add('auth-pending');</script>
    <style>html.auth-pending body { visibility: hidden; }</style>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- =========================
     HEADER
     ========================= -->
<header class="admin-header">
    <h1>Panel Admina</h1>
    <button type="button" class="button" onclick="logout()">Wyloguj</button>

    <div class="header-toggles">
        <div class="toggle-item">
            <span class="toggle-label">Dodaj dział</span>
            <label class="switch">
                <input type="checkbox" id="section-add-toggle" data-panel-toggle="section-add-panel" checked
                       aria-label="Pokaż panel dodawania działu">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-item">
            <span class="toggle-label">Dodaj użytkownika</span>
            <label class="switch">
                <input type="checkbox" id="user-add-toggle" data-panel-toggle="user-add-panel" checked
                       aria-label="Pokaż panel dodawania użytkownika">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-item">
            <span class="toggle-label">Tryb ciemny</span>
            <label class="switch">
                <input type="checkbox" id="theme-toggle" aria-label="Tryb ciemny">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</header>

<section id="data-tables-section">

    <!-- =========================
         PANEL ADMINA
         ========================= -->
    <div id="admin-panel">

        <!-- Dodaj dział (pasek na całą szerokość) -->
        <section class="section-add" id="section-add-panel">
            <h2 class="panel-title">Dodaj dział</h2>

            <form id="add-section-form" class="section-add-form">
                <input type="text" id="add-section-name" placeholder="Nazwa działu" required autocomplete="off"
                       aria-label="Nazwa działu">
                <button type="submit" class="plus-button" title="Dodaj dział" aria-label="Dodaj dział">+</button>
            </form>
        </section>

        <!-- Dodaj użytkownika -->
        <section class="user-add" id="user-add-panel">
            <h2 class="panel-title">Dodaj użytkownika</h2>

            <form id="add-user-form" class="user-add-form">

                <div class="form-field f-id">
                    <label for="add-id">Id</label>
                    <input type="text" id="add-id" class="id-input" placeholder="AUTO" title="Nadawane automatycznie" disabled>
                </div>

                <div class="form-field f-phone">
                    <label for="add-phone">Telefon opcjonalnie( FAX )</label>
                    <input type="text" id="add-phone" placeholder="np. 123 456 789 FAX: 22 111 70 80" maxlength="60">
                </div>

                <div class="form-field f-room">
                    <label for="add-room">Nr pokoju</label>
                    <input type="text" id="add-room" placeholder="Nr pokoju">
                </div>

                <div class="form-field f-section">
                    <label for="add-section-id">Dział</label>
                    <select id="add-section-id" required>
                        <option value="" disabled selected>Wybierz dział...</option>
                    </select>
                </div>

                <div class="form-field f-designation">
                    <label for="add-designation">Oznaczenie użytkownika</label>
                    <input type="text" id="add-designation" placeholder="np. IT-01">
                </div>

                <div class="form-field f-name">
                    <label for="add-name">Imię</label>
                    <input type="text" id="add-name" placeholder="Imię" maxlength="255" required>
                </div>

                <div class="form-field f-last-name">
                    <label for="add-last-name">Nazwisko</label>
                    <input type="text" id="add-last-name" placeholder="Nazwisko" maxlength="255" required>
                </div>

                <div class="form-field f-email">
                    <label for="add-email">Adres pocztowy elektroniczny</label>
                    <input type="text" id="add-email" placeholder="jan.kowalski@firma.pl" maxlength="255">
                </div>

                <div class="form-field f-ip">
                    <label for="add-ip">Ip</label>
                    <input type="text" id="add-ip" placeholder="np. 192.168.0.10"
                           inputmode="decimal" maxlength="15"
                           pattern="((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])"
                           title="Poprawny adres IPv4, np. 192.168.0.10">
                </div>

                <div class="form-actions">
                    <button type="submit" class="add-user-button">Dodaj użytkownika</button>
                </div>

            </form>
        </section>

    </div>

    <!-- =========================
         WYSZUKIWANIE
         ========================= -->
    <div id="search-panel">
        <div id="search-wrapper">
            <input type="search" id="global-search" placeholder="Szukaj użytkownika we wszystkich działach..."
                   autocomplete="off" aria-label="Szukaj użytkownika we wszystkich działach">
            <button type="button" id="clear-search">Wyczyść</button>
        </div>

        <div id="search-info" aria-live="polite">Ładowanie danych…</div>
    </div>

    <!-- =========================
         TABELE (generowane w script.js)
         ========================= -->
    <div id="dynamic-tables-container">
        <div class="state-message">Ładowanie danych…</div>
    </div>

</section>

<!-- =========================
     OKNO POTWIERDZENIA
     ========================= -->
<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog">
        <h2 id="confirm-title" class="confirm-title"></h2>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-actions">
            <button type="submit" value="cancel" class="button button-secondary" autofocus>Anuluj</button>
            <button type="submit" value="confirm" id="confirm-ok" class="button button-danger">Usuń</button>
        </div>
    </form>
</dialog>

<!-- =========================
     POWIADOMIENIA
     ========================= -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>


<!-- =========================
     PANEL EDYCJI (generowany w script.js)
     ========================= -->   
<dialog id="edit-dialog" class="confirm-dialog edit-dialog" aria-labelledby="edit-title">
    <form id="edit-user-form">
        <h2 id="edit-title" class="confirm-title">Edytuj użytkownika <span id="edit-id-label"></span></h2>

        <div class="edit-grid">
            <div class="form-field">
                <label for="edit-phone">Nr telefonu</label>
                <input type="text" id="edit-phone" maxlength="60">
            </div>
            <div class="form-field">
                <label for="edit-room">Nr pokoju</label>
                <input type="text" id="edit-room">
            </div>
            <div class="form-field">
                <label for="edit-section-id">Dział</label>
                <select id="edit-section-id" required></select>
            </div>
            <div class="form-field">
                <label for="edit-designation">Oznaczenie użytkownika</label>
                <input type="text" id="edit-designation">
            </div>
            <div class="form-field">
                <label for="edit-name">Imię</label>
                <input type="text" id="edit-name" required>
            </div>
            <div class="form-field">
                <label for="edit-last-name">Nazwisko</label>
                <input type="text" id="edit-last-name" required>
            </div>
            <div class="form-field">
                <label for="edit-email">Adres pocztowy elektroniczny</label>
                <input type="text" id="edit-email">
            </div>
            <div class="form-field">
                <label for="edit-ip">Ip</label>
                <input type="text" id="edit-ip" maxlength="15"
                       pattern="((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])"
                       title="Poprawny adres IPv4, np. 192.168.0.10">
            </div>
        </div>

        <div class="confirm-actions">
            <button type="button" id="edit-cancel" class="button button-secondary">Anuluj</button>
            <button type="submit" id="edit-save" class="button button-primary">Zapisz zmiany</button>
        </div>
    </form>
</dialog>

<script src="admin.js"></script>
<script src="script.js"></script>

</body>
</html>
