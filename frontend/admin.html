<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleBook - Panel Administratora</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body.auth-checking {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body class="auth-checking">

<header class="admin-header">
    <h1>Panel Admina</h1>
    <button type="button" onclick="logout()">Wyloguj</button>
    <div class="header-toggles">
        <div class="toggle-item">
            <span class="toggle-label">Tryb ciemny</span>
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider theme-slider"></span>
            </label>
        </div>

        <div class="toggle-item">
            <span class="toggle-label">Widok admina</span>
            <label class="switch">
                <input type="checkbox" id="admin-toggle" checked>
                <span class="slider admin-slider"></span>
            </label>
        </div>
    </div>
</header>

<section id="data-tables-section">
    <div id="search-panel">
        <div id="search-wrapper">
            <input type="search" id="global-search" placeholder="Szukaj użytkownika we wszystkich działach..." autocomplete="off">
            <button type="button" id="clear-search">Wyczyść</button>
        </div>

        <div id="search-info">Wszyscy użytkownicy</div>
    </div>

    <div id="dynamic-tables-container"></div>
</section>

<script src="script.js"></script>

</body>
</html>
